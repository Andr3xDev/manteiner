name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  validate:
    name: Validate (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [core, cli, tui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.crate }}
      - name: Build
        run: cargo build --package ${{ matrix.crate }} --verbose
      - name: Clippy
        run: cargo clippy --package ${{ matrix.crate }} --all-targets -- -D warnings
      - name: Test
        run: cargo test --package ${{ matrix.crate }} --verbose
